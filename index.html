<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIHU CREATIONS - Address Form</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#222;
}

.container{
  max-width:650px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#8b5a2b;
  margin-bottom:5px;
}

.tagline{
  text-align:center;
  font-size:14px;
  color:#777;
  margin-bottom:25px;
}

h2{
  text-align:center;
  margin:0 0 20px;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
  font-size:14px;
}

.required{
  color:red;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#8b5a2b;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#999;
}

.note{
  margin-top:15px;
  padding:12px;
  background:#fff7ed;
  border-radius:8px;
  font-size:13px;
  color:#666;
  text-align:center;
}

.pincode-status{
  margin-top:6px;
  font-size:13px;
  color:#777;
}

.success{
  display:none;
  text-align:center;
  padding:30px 15px;
}

.success-icon{
  font-size:55px;
}

.success h2{
  color:#2e7d32;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#888;
}

</style>
</head>


<body>

<div class="container">

  <div class="logo">
    VIHU CREATIONS
  </div>

  <div class="tagline">
    A Brand of Creativity
  </div>


  <div id="fbox">

    <h2>Delivery Address</h2>

    <form
      id="f"
      method="POST"
      target="addressSubmitFrame"
    >

      <input
        type="hidden"
        name="action"
        value="saveAddress"
      >


      <div class="form-group">

        <label>
          Name <span class="required">*</span>
        </label>

        <input
          type="text"
          name="name"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Mobile Number <span class="required">*</span>
        </label>

        <input
          type="tel"
          name="mobile"
          maxlength="10"
          pattern="[0-9]{10}"
          inputmode="numeric"
          required
        >

      </div>


      <div class="form-group">

        <label>
          House / Flat / Shop
        </label>

        <input
          type="text"
          name="houseFlat"
        >

      </div>


      <div class="form-group">

        <label>
          Area / Colony
          <span class="required">*</span>
        </label>

        <input
          type="text"
          name="areaColony"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Full Address
          <span class="required">*</span>
        </label>

        <textarea
          name="fullAddress"
          required
        ></textarea>

      </div>


      <!-- PINCODE -->

      <div class="form-group">

        <label>
          Pincode
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="pincode"
          name="pincode"
          maxlength="6"
          pattern="[0-9]{6}"
          inputmode="numeric"
          autocomplete="postal-code"
          required
        >

        <div
          id="pincodeStatus"
          class="pincode-status"
        ></div>

      </div>


      <!-- CITY -->

      <div class="form-group">

        <label>
          City
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="city"
          name="city"
          autocomplete="address-level2"
          required
        >

      </div>


      <!-- STATE -->

      <div class="form-group">

        <label>
          State
          <span class="required">*</span>
        </label>

        <select
          id="state"
          name="state"
          autocomplete="address-level1"
          required
        >

          <option value="">
            Select State / UT
          </option>

          <option>Andhra Pradesh</option>
          <option>Arunachal Pradesh</option>
          <option>Assam</option>
          <option>Bihar</option>
          <option>Chhattisgarh</option>
          <option>Goa</option>
          <option>Gujarat</option>
          <option>Haryana</option>
          <option>Himachal Pradesh</option>
          <option>Jharkhand</option>
          <option>Karnataka</option>
          <option>Kerala</option>
          <option>Madhya Pradesh</option>
          <option>Maharashtra</option>
          <option>Manipur</option>
          <option>Meghalaya</option>
          <option>Mizoram</option>
          <option>Nagaland</option>
          <option>Odisha</option>
          <option>Punjab</option>
          <option>Rajasthan</option>
          <option>Sikkim</option>
          <option>Tamil Nadu</option>
          <option>Telangana</option>
          <option>Tripura</option>
          <option>Uttar Pradesh</option>
          <option>Uttarakhand</option>
          <option>West Bengal</option>

          <option value="Andaman and Nicobar Islands">
            Andaman and Nicobar Islands
          </option>

          <option value="Chandigarh">
            Chandigarh
          </option>

          <option value="Dadra and Nagar Haveli and Daman and Diu">
            Dadra and Nagar Haveli and Daman and Diu
          </option>

          <option value="Delhi">
            Delhi
          </option>

          <option value="Jammu and Kashmir">
            Jammu and Kashmir
          </option>

          <option value="Ladakh">
            Ladakh
          </option>

          <option value="Lakshadweep">
            Lakshadweep
          </option>

          <option value="Puducherry">
            Puducherry
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Landmark
        </label>

        <input
          type="text"
          name="landmark"
        >

      </div>


      <div class="form-group">

        <label>
          Delivery Instructions
        </label>

        <textarea
          name="instructions"
        ></textarea>

      </div>


      <button
        type="submit"
        id="b"
      >
        Submit Address
      </button>

    </form>


    <div class="note">

      Please check your address and mobile number
      carefully before submitting.

    </div>

  </div>


  <div
    class="success"
    id="ok"
  >

    <div class="success-icon">
      ✅
    </div>

    <h2>
      Address Submitted Successfully
    </h2>

    <p>
      Thank you! Your delivery address has been received by
      <b>VIHU CREATIONS</b>.
    </p>

  </div>


  <div class="footer">
    © VIHU CREATIONS
  </div>

</div>


<iframe
  name="addressSubmitFrame"
  id="addressSubmitFrame"
  style="display:none;"
></iframe>


<script>

/* =========================================================
   VIHU CREATIONS
   CURRENT GOOGLE APPS SCRIPT WEB APP - VERSION 64
   ========================================================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbys0SkJycxU_4dhrUHPNjKPOtBiqj6jWMVP2OW7zkGVxD-UQuxQLuH2ZU3dFYfHkHsh/exec";


const form =
document.getElementById("f");

const button =
document.getElementById("b");

const formBox =
document.getElementById("fbox");

const successBox =
document.getElementById("ok");


/* =========================================================
   PINCODE LOOKUP
   Pincode dalte hi City + State automatic fill
   ========================================================= */

const pincodeInput =
document.getElementById("pincode");

const cityInput =
document.getElementById("city");

const stateInput =
document.getElementById("state");

const pincodeStatus =
document.getElementById("pincodeStatus");


let pincodeTimer = null;


pincodeInput.addEventListener(
  "input",
  function(){

    /* Sirf numbers allow */
    this.value =
      this.value.replace(/\D/g,"").slice(0,6);

    cityInput.value = "";
    stateInput.value = "";
    pincodeStatus.textContent = "";

    clearTimeout(pincodeTimer);

    if(this.value.length !== 6){
      return;
    }

    pincodeStatus.textContent =
      "Checking pincode...";

    pincodeTimer =
      setTimeout(
        function(){

          lookupPincode(
            pincodeInput.value
          );

        },
        300
      );

  }
);


/* =========================================================
   PINCODE API
   ========================================================= */

async function lookupPincode(pin){

  try{

    const response =
      await fetch(
        "https://api.postalpincode.in/pincode/" +
        encodeURIComponent(pin)
      );

    if(!response.ok){
      throw new Error("Network error");
    }

    const result =
      await response.json();

    if(
      !result ||
      !result[0] ||
      result[0].Status !== "Success" ||
      !result[0].PostOffice ||
      !result[0].PostOffice.length
    ){

      pincodeStatus.textContent =
        "Pincode not found. Please enter City and State manually.";

      return;
    }


    const offices =
      result[0].PostOffice;


    /*
      First Post Office is normally enough
      for City / District / State.
    */

    const office =
      offices[0];


    /* City */

    cityInput.value =
      office.District ||
      office.Block ||
      office.Division ||
      "";


    /* State */

    const apiState =
      String(
        office.State || ""
      ).trim();


    /*
      Dropdown me exact state milne par
      wahi select hoga.
    */

    let matched = false;

    for(
      let i=0;
      i<stateInput.options.length;
      i++
    ){

      if(
        stateInput.options[i].value.toLowerCase() ===
        apiState.toLowerCase()
      ){

        stateInput.selectedIndex = i;

        matched = true;

        break;
      }

    }


    if(!matched && apiState){

      /*
        Agar API ka naam dropdown ke naam
        se exactly match nahi hua to
        manual option ke liye blank rakhenge.
      */

      stateInput.value = "";

    }


    pincodeStatus.textContent =
      "✓ City and State found automatically.";

  }
  catch(error){

    console.log(
      "Pincode lookup error:",
      error
    );

    pincodeStatus.textContent =
      "Pincode lookup unavailable. Please enter City and State manually.";

  }

}


/* =========================================================
   FORM SUBMIT
   ========================================================= */

form.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    /* Disable button */
    button.disabled = true;

    button.textContent =
      "Submitting...";


    /* Current Apps Script URL */
    form.action =
      WEB_APP_URL;

    form.method =
      "POST";

    form.target =
      "addressSubmitFrame";


    /* Submit form */
    form.submit();


    /*
      Wait for Apps Script submission.
      Then show success screen.
    */

    setTimeout(
      function(){

        formBox.style.display =
          "none";

        successBox.style.display =
          "block";

      },
      2500
    );

  }
);

</script>


</body>
</html>
