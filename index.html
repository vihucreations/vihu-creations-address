<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIHU CREATIONS - Address Form</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial, sans-serif;
  background:#f4f4f4;
  color:#222;
}

.container{
  max-width:650px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  letter-spacing:1px;
  color:#8b5a2b;
  margin-bottom:5px;
}

.tagline{
  text-align:center;
  font-size:14px;
  color:#777;
  margin-bottom:25px;
}

h2{
  text-align:center;
  margin:0 0 20px;
  font-size:22px;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#8b5a2b;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.required{
  color:red;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#8b5a2b;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#70451f;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.note{
  margin-top:15px;
  padding:12px;
  background:#fff7ed;
  border-radius:8px;
  font-size:13px;
  color:#666;
  text-align:center;
}

.success{
  display:none;
  text-align:center;
  padding:30px 15px;
}

.success-icon{
  font-size:55px;
  margin-bottom:10px;
}

.success h2{
  color:#2e7d32;
  margin-bottom:10px;
}

.success p{
  font-size:16px;
  line-height:1.5;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#888;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  .container{
    padding:18px;
  }

  .logo{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    VIHU CREATIONS
  </div>

  <div class="tagline">
    A Brand of Creativity
  </div>

  <!-- ADDRESS FORM -->
  <div id="fbox">

    <h2>Delivery Address</h2>

    <form id="f">

      <div class="form-group">
        <label>
          Name <span class="required">*</span>
        </label>

        <input
          type="text"
          name="name"
          placeholder="Enter your full name"
          required
        >
      </div>


      <div class="form-group">
        <label>
          Mobile Number <span class="required">*</span>
        </label>

        <input
          type="tel"
          name="mobile"
          placeholder="Enter 10 digit mobile number"
          maxlength="10"
          pattern="[0-9]{10}"
          required
        >
      </div>


      <div class="form-group">
        <label>
          House / Flat / Shop
        </label>

        <input
          type="text"
          name="houseFlat"
          placeholder="House no., Flat no., Shop no."
        >
      </div>


      <div class="form-group">
        <label>
          Area / Colony <span class="required">*</span>
        </label>

        <input
          type="text"
          name="areaColony"
          placeholder="Enter area / colony"
          required
        >
      </div>


      <div class="form-group">
        <label>
          Full Address <span class="required">*</span>
        </label>

        <textarea
          name="fullAddress"
          placeholder="Enter complete delivery address"
          required
        ></textarea>
      </div>


      <div class="form-group">
        <label>
          City <span class="required">*</span>
        </label>

        <input
          type="text"
          name="city"
          placeholder="Enter city"
          required
        >
      </div>


      <div class="form-group">
        <label>
          State <span class="required">*</span>
        </label>

        <input
          type="text"
          name="state"
          placeholder="Enter state"
          required
        >
      </div>


      <div class="form-group">
        <label>
          Pincode <span class="required">*</span>
        </label>

        <input
          type="text"
          name="pincode"
          placeholder="Enter 6 digit pincode"
          maxlength="6"
          pattern="[0-9]{6}"
          required
        >
      </div>


      <div class="form-group">
        <label>
          Landmark
        </label>

        <input
          type="text"
          name="landmark"
          placeholder="Nearby landmark"
        >
      </div>


      <div class="form-group">
        <label>
          Delivery Instructions
        </label>

        <textarea
          name="instructions"
          placeholder="Any special delivery instructions"
        ></textarea>
      </div>


      <button type="submit" id="b">
        Submit Address
      </button>

    </form>


    <div class="note">
      Please check your address and mobile number carefully before submitting.
    </div>

  </div>


  <!-- SUCCESS MESSAGE -->
  <div class="success" id="ok">

    <div class="success-icon">
      ✅
    </div>

    <h2>Address Submitted Successfully</h2>

    <p>
      Thank you! Your delivery address has been received by
      <b>VIHU CREATIONS</b>.
    </p>

    <p>
      You may now close this page.
    </p>

  </div>


  <div class="footer">
    © VIHU CREATIONS
  </div>

</div>


<!--
  Hidden iframe.
  Form data is submitted to Google Apps Script
  without leaving this page.
-->
<iframe
  name="hiddenSubmitFrame"
  id="hiddenSubmitFrame"
  style="display:none;width:0;height:0;border:0;">
</iframe>


<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzzNwe3PYbnRe8Gd0kMi7vkx49P5jZ4wy4_X5Xy8p8rUNg5jLQ24jw7Q4sG3eyQlswQ/exec";


const form = document.getElementById("f");
const button = document.getElementById("b");
const formBox = document.getElementById("fbox");
const successBox = document.getElementById("ok");


form.addEventListener("submit", function(e){

  e.preventDefault();


  /* Disable button */
  button.disabled = true;
  button.textContent = "Submitting...";


  /* Send form directly to Apps Script */
  form.action = WEB_APP_URL;
  form.method = "POST";
  form.target = "hiddenSubmitFrame";


  /* Submit */
  form.submit();


  /*
    Give Apps Script time to receive the data,
    then show success message.
  */
  setTimeout(function(){

    formBox.style.display = "none";
    successBox.style.display = "block";

  },1500);


});

</script>

</body>
</html>
