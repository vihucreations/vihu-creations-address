<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Vihu Creations – Address</title>

<style>
body{
  margin:0;
  background:#f4f4f4;
  font-family:Arial,sans-serif
}

.box{
  max-width:600px;
  margin:18px auto;
  padding:20px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 4px 18px #0002
}

.brand{
  text-align:center;
  font-size:25px;
  font-weight:bold
}

.tag{
  text-align:center;
  color:#777;
  margin:4px 0 20px
}

label{
  font-weight:bold;
  display:block;
  margin:12px 0 6px
}

input,select,textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px
}

textarea{
  min-height:85px
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#222;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:18px
}

.ok{
  display:none;
  text-align:center;
  padding:30px 5px
}

@media(max-width:520px){
  .row{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div class="box">

<div id="fbox">

<div class="brand">VIHU CREATIONS</div>

<div class="tag">
A Brand of Creativity
</div>

<form id="f">

<label>Name *</label>
<input name="name" required>

<div class="row">

<div>
<label>Mobile Number *</label>
<input name="mobile" type="tel" required>
</div>

<div>
<label>Pincode *</label>
<input name="pincode" maxlength="6" required>
</div>

</div>

<label>House / Flat No. *</label>
<input name="houseFlat" required>

<label>Area / Colony *</label>
<input name="areaColony" required>

<label>Full Address *</label>
<textarea name="fullAddress" required></textarea>

<div class="row">

<div>
<label>City *</label>
<input name="city" required>
</div>

<div>
<label>State *</label>

<select name="state" required>

<option value="">Select</option>
<option>Madhya Pradesh</option>
<option>Rajasthan</option>
<option>Maharashtra</option>
<option>Gujarat</option>
<option>Delhi</option>
<option>Uttar Pradesh</option>
<option>Other</option>

</select>

</div>

</div>

<label>Landmark</label>
<input name="landmark">

<label>Special Delivery Instructions</label>
<textarea name="instructions"></textarea>

<button id="b">
Submit Address
</button>

</form>

</div>

<div id="ok" class="ok">

<h2>✓ Address Submitted</h2>

<p>
Thank you. Vihu Creations has received your details.
</p>

</div>

</div>

<script>

const WEB_APP_URL="https://script.google.com/macros/s/AKfycbzzNwe3PYbnRe8Gd0kMi7vkx49P5jZ4wy4_X5Xy8p8rUNg5jLQ24jw7Q4sG3eyQlswQ/exec";

f.addEventListener("submit",async e=>{

e.preventDefault();

if(WEB_APP_URL.includes("PASTE_"))
return alert("Admin setup pending.");

b.disabled=true;
b.textContent="Submitting...";

try{

await fetch(WEB_APP_URL,{
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":"text/plain"
},
body:JSON.stringify(
Object.fromEntries(
new FormData(f).entries()
)
)
});

fbox.style.display="none";
ok.style.display="block";

}catch(x){

alert("Submit failed. Please try again.");

b.disabled=false;
b.textContent="Submit Address";

}

})

</script>

</body>
</html>
